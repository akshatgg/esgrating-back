[project]
name = "esgratings-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openai>=1.40",
    "pydantic-settings>=2.15.0",
    # The [aws] extra (pymongo-auth-aws + boto3) is what makes authMechanism=MONGODB-AWS
    # work: Atlas authenticates the api container as the IAM user ezrating-atlas-prod
    # instead of a database password. Credentials arrive as AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY in api.env, written from SSM by deploy/deploy.sh.
    "pymongo[aws]>=4.8,<5",
    # BFSI keeps pypdf (its original PHP port used Smalot\PdfParser; pypdf is the Python
    # equivalent). This is a separate package from PyPDF2 below -- no conflict.
    "pypdf>=6",
    # Pinned to the version an unpinned production install resolves to, so extracted page
    # text -- and therefore the sha256 cache hash -- stays identical to production.
    "PyPDF2==3.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "mongomock>=4.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Upstream starlette 1.6.0 TestClient still references the deprecated
    # anyio.abc.BlockingPortal alias; nothing in our code to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    # PyPDF2 3.0.1 warns on import that it is superseded by pypdf. The pin is deliberate
    # (see pyproject dependencies): it keeps page text and the sha256 cache hash identical
    # to production. Nothing to fix here.
    "ignore:PyPDF2 is deprecated:DeprecationWarning:PyPDF2",
]
